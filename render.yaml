# Render Blueprint: Classroom Attendance Management System (single service)
# One Node web service serves the Express API (/api, /health) and the
# Vite SPA build (all other GET routes -> dist/index.html), so frontend
# and backend share one origin and auth cookies stay SameSite=Strict.
#
# Database: external TiDB Cloud MySQL. DATABASE_URL is entered at deploy
# time (sync: false) and never committed to git.

services:
  - type: web
    name: cams-app
    runtime: node
    region: singapore # closest to TiDB ap-southeast-1, minimizes DB latency
    rootDir: Backend
    plan: free # sleeps when idle; use `starter`+ for always-on
    buildCommand: >-
      npm install &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm --prefix ../Frontend install &&
      npm --prefix ../Frontend run build
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false # paste TiDB connection string at deploy time
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
